name: Release

# On a version tag (v0.1.0): build the wheels and the sdist, test the wheels
# on clean systems, then publish a GitHub release and upload to PyPI.
# Other triggers only build and test.
on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - ".github/**"
      - "build.rs"
      - "Cargo.*"
      - "pyproject.toml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: Wheel (Linux ${{ matrix.arch }})
    strategy:
      matrix:
        include:
          - { runner: ubuntu-latest, arch: x86_64 }
          - { runner: ubuntu-24.04-arm, arch: aarch64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: PyO3/maturin-action@v1
        with:
          container: quay.io/pypa/manylinux_2_28_${{ matrix.arch }}
          manylinux: "2_28"
          # A static libpcap, linked into the extension.
          before-script-linux: sh .github/build-libpcap.sh
          args: --release --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-${{ matrix.arch }}
          path: dist

  macos:
    name: Wheel (macOS universal2)
    runs-on: macos-latest
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
      # Link the system libpcap, never a Homebrew one found by pkg-config.
      PKG_CONFIG: /usr/bin/false
    steps:
      - uses: actions/checkout@v5
      - uses: PyO3/maturin-action@v1
        with:
          target: universal2-apple-darwin
          args: --release --out dist
      - name: Check that only system libraries are linked
        run: |
          unzip -q -o dist/*.whl -d unpacked
          otool -L unpacked/flowreassemble/_native.abi3.so | tee libs.txt
          # Library lines are indented; both architectures are listed, each
          # starting with the extension's own install name.
          if grep -E '^\s' libs.txt | grep -v -E '^\s+(/usr/lib/|/System/Library/|@rpath/flowreassemble\._native\.abi3\.so )'; then
            echo "the extension links a library that is not part of macOS"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-macos-universal2
          path: dist

  sdist:
    name: Source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist

  test-linux:
    name: Test wheel (Linux ${{ matrix.arch }}, Python ${{ matrix.python }})
    needs: linux
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
        python: ["3.10", "3.14"]
    runs-on: ${{ matrix.arch == 'aarch64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    # A bare system: no libpcap, no compiler.
    container: python:${{ matrix.python }}-slim
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: wheels-linux-${{ matrix.arch }}
          path: dist
      - run: pip install --root-user-action=ignore dist/*.whl pytest
      - run: python -m pytest

  test-macos:
    name: Test wheel (${{ matrix.runner }}, Python ${{ matrix.python }})
    needs: macos
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-latest, macos-15-intel]
        python: ["3.10", "3.14"]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v4
        with:
          name: wheels-macos-universal2
          path: dist
      - run: pip install dist/*.whl pytest
      - run: python -m pytest

  github-release:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [sdist, test-linux, test-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Check that the tag matches the package version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml)
          test "${GITHUB_REF_NAME}" = "v${version}" || {
            echo "tag ${GITHUB_REF_NAME} does not match version ${version} in pyproject.toml"
            exit 1
          }
          grep -q "^version = \"${version}\"" Cargo.toml
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}

  pypi:
    name: Publish to PyPI
    needs: github-release
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/flowreassemble
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
