name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Lint and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
      - name: Set up the dev environment
        run: nix develop -c make dev
      - name: Lint
        run: nix develop -c make lint
      - name: Test
        run: nix develop -c make test
      - name: Docs
        run: nix develop -c make docs
