# Read the Docs build: the API reference needs the real extension, so the
# package is built from source (Rust, libhtp, libpcap) before Sphinx runs.
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
    rust: latest
  apt_packages:
    - libpcap-dev
    - zlib1g-dev
    - pkg-config
  jobs:
    pre_create_environment:
      - asdf plugin add uv
      - asdf install uv latest
      - asdf global uv latest
    create_environment:
      - uv venv "${READTHEDOCS_VIRTUALENV_PATH}"
    install:
      - UV_PROJECT_ENVIRONMENT="${READTHEDOCS_VIRTUALENV_PATH}" uv sync --frozen --no-default-groups --group docs

sphinx:
  configuration: docs/conf.py
  fail_on_warning: true
