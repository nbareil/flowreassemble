[build-system]
requires = ["maturin>=1.15,<2"]
build-backend = "maturin"

[project]
name = "flowreassemble"
version = "0.1.0"
description = "IP defragmentation and TCP/UDP flow reassembly for Python, with libhtp HTTP parsing"
readme = "README.md"
license = "BSD-3-Clause"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Topic :: System :: Networking :: Monitoring",
    "Topic :: Security",
]

[project.urls]
Documentation = "https://flowreassemble.readthedocs.io/"
Source = "https://github.com/nbareil/flowreassemble"
Issues = "https://github.com/nbareil/flowreassemble/issues"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8"]
docs = [
    "furo>=2025.12.19",
    "myst-parser>=4.0.1",
    "sphinx>=8.1.3",
]

[tool.uv]
# `make dev` installs the docs tools too.
default-groups = ["dev", "docs"]

[tool.maturin]
python-source = "python"
module-name = "flowreassemble._native"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100
