[build-system]
requires = ["maturin>=1.15,<2"]
build-backend = "maturin"

[project]
name = "flowreassemble"
version = "0.1.0"
description = "IP defragmentation and TCP/UDP flow reassembly for Python, with libhtp HTTP parsing"
readme = "README.md"
license = "BSD-3-Clause"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Topic :: System :: Networking :: Monitoring",
    "Topic :: Security",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8"]

[tool.maturin]
python-source = "python"
module-name = "flowreassemble._native"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100
